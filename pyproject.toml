[project]
name = "django-gmail-reference-implementation"
version = "0.1.0"
description = "A production-minded reference for Gmail OAuth and synchronization in Django"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.5,<6",
  "cryptography>=45,<51",
  "django>=5.2,<6.1",
  "django-environ>=0.12,<1",
  "google-api-python-client>=2.170,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["S101"]

